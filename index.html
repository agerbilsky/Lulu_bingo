<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bingo musical · Cumple de Lulú</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --night:#221C56; --deep:#2E2670; --purple:#534AB7; --lav:#AFA9EC; --mist:#EEEDFE;
  --gold:#F2A93B; --goldDark:#7A4A08; --ink:#1B1640; --white:#FFFFFF;
  --font:"Baloo 2", "Trebuchet MS", system-ui, -apple-system, "Segoe UI", sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --night:#221C56; } }
:root[data-theme="dark"]{ --night:#221C56; }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--night);color:var(--white);font-family:var(--font);overflow-x:hidden}
button,input{font-family:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.app{min-height:100%;display:grid;grid-template-rows:auto 1fr;gap:clamp(12px,2vh,24px);padding:clamp(14px,2.2vw,36px)}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px}
.brand .note{font-size:clamp(28px,3vw,48px);color:var(--lav);line-height:1}
.brand h1{margin:0;font-size:clamp(26px,2.8vw,46px);font-weight:800;line-height:1;display:flex;align-items:center;gap:12px}
.brand p{margin:2px 0 0;color:var(--lav);font-size:clamp(14px,1.3vw,20px)}
.progress{display:flex;align-items:center;gap:14px;color:var(--lav);font-size:clamp(15px,1.3vw,20px)}
.bar{width:clamp(120px,14vw,240px);height:12px;border-radius:99px;background:var(--deep);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--gold);border-radius:99px;transition:width .4s}
.progress b{color:var(--white);font-weight:700}

main{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:clamp(16px,2.4vw,40px);min-height:0}
@media (max-width:900px){main{grid-template-columns:1fr}}

.stage{display:flex;flex-direction:column;gap:clamp(14px,2vh,24px);min-width:0}
.now{position:relative;flex:1;min-height:clamp(240px,42vh,560px);background:var(--purple);border-radius:28px;padding:clamp(22px,3vw,52px);display:flex;flex-direction:column;justify-content:center;overflow:hidden}
.now .k{color:var(--mist);font-size:clamp(16px,1.5vw,24px);margin:0 0 6px;font-weight:500}
.now .num{position:absolute;right:clamp(18px,2.4vw,40px);top:clamp(14px,2vw,30px);font-size:clamp(18px,1.6vw,26px);color:var(--mist);font-weight:600}
.now h2{margin:0;font-size:clamp(40px,6.2vw,112px);line-height:.95;font-weight:800;letter-spacing:-.01em;text-wrap:balance;overflow-wrap:anywhere}
.now .artist{margin:14px 0 0;font-size:clamp(20px,2.3vw,38px);color:var(--gold);font-weight:600}
.now .bigstar{position:absolute;right:-30px;bottom:-40px;width:clamp(160px,18vw,300px);opacity:.18;pointer-events:none}
.now.empty h2{font-size:clamp(34px,4.4vw,76px)}
.now.pop h2,.now.pop .artist{animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:translateY(14px) scale(.96);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.now.pop h2,.now.pop .artist{animation:none}}

.prev h3{margin:0 0 8px;font-size:clamp(15px,1.3vw,20px);color:var(--lav);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--deep);border-radius:12px;padding:6px 12px;font-size:clamp(14px,1.2vw,18px);color:var(--mist)}
.chip b{color:var(--gold);font-weight:700;margin-right:6px}
.chips .none{color:var(--lav);font-size:16px}

.actions{display:flex;flex-wrap:wrap;gap:10px}
.btn{border:0;border-radius:14px;padding:12px 20px;font-size:clamp(16px,1.3vw,20px);font-weight:600;cursor:pointer;background:var(--deep);color:var(--white)}
.btn:hover{background:#3A3188}
.btn.gold{background:var(--gold);color:var(--ink)}
.btn.gold:hover{background:#F7BC5E}
.btn.ghost{background:transparent;color:var(--lav);box-shadow:inset 0 0 0 2px var(--deep)}
.btn.warn{background:#A32D2D}

.board{display:flex;flex-direction:column;gap:12px;min-width:0}
.search{display:flex;gap:10px}
.search input{flex:1;min-width:0;border:0;border-radius:14px;padding:12px 16px;font-size:clamp(16px,1.3vw,20px);background:var(--deep);color:var(--white)}
.search input::placeholder{color:var(--lav)}
.grid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
@media (max-width:560px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{position:relative;border:0;border-radius:12px;background:var(--deep);color:var(--mist);padding:6px 6px 8px;min-height:clamp(58px,7.2vh,84px);text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;transition:background .2s}
.tile:hover{background:#3A3188}
.tile .n{font-size:13px;font-weight:700;color:var(--lav)}
.tile .t{overflow-wrap:break-word;hyphens:auto;-webkit-hyphens:auto;font-size:clamp(11px,.85vw,14px);line-height:1.1;font-weight:500;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile.played{background:var(--gold);color:var(--ink)}
.tile.played .n{color:var(--goldDark)}
.tile.current{box-shadow:0 0 0 3px var(--white)}
.tile.dim{opacity:.22}
.hint{min-height:22px;color:var(--lav);font-size:15px;margin:0}

.overlay{position:fixed;inset:0;background:rgba(20,16,52,.86);display:none;align-items:center;justify-content:center;padding:20px;z-index:10}
.overlay.open{display:flex}
.modal{background:var(--white);color:var(--ink);border-radius:24px;padding:clamp(18px,2.4vw,34px);width:min(1100px,100%);max-height:100%;overflow:auto}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.mhead h2{margin:0;font-size:clamp(24px,2.4vw,36px);font-weight:800;color:var(--purple)}
.pick{display:flex;gap:10px;align-items:center}
.pick input{width:110px;border:2px solid var(--lav);border-radius:12px;padding:10px 12px;font-size:22px;font-weight:700;color:var(--ink);text-align:center}
.pick .btn{background:var(--purple)}
.err{color:#A32D2D;font-size:15px;margin:0 0 10px;min-height:20px}
.cgrid-wrap{overflow-x:auto}
.cgrid{display:grid;grid-template-columns:repeat(9,minmax(86px,1fr));border:3px solid var(--purple);border-radius:12px;overflow:hidden;min-width:780px}
.cc{min-height:86px;border-right:1px solid var(--lav);border-bottom:1px solid var(--lav);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:6px;font-size:14px;line-height:1.15}
.cc:nth-child(9n){border-right:0}.cc:nth-last-child(-n+9){border-bottom:0}
.cc.e{background:var(--mist);color:var(--lav);font-size:22px}
.cc b{font-weight:700}.cc small{color:#5F5E5A;font-size:12px;margin-top:2px}
.cc.hit{background:var(--gold)}.cc.hit small{color:var(--goldDark)}
.cc.rowwin{box-shadow:inset 0 0 0 3px var(--purple)}
.verdict{margin:18px 0 0;font-size:clamp(22px,2.4vw,36px);font-weight:800;color:var(--purple);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.verdict.win{color:var(--goldDark)}
.verdict small{font-size:clamp(15px,1.3vw,19px);font-weight:500;color:#5F5E5A}
.mfoot{display:flex;justify-content:flex-end;margin-top:18px}
.mfoot .btn{background:var(--deep)}

.winbox{display:none;margin-top:14px;gap:10px;align-items:center;flex-wrap:wrap}
.winbox.show{display:flex}
.winbox input{flex:1;min-width:200px;border:2px solid var(--lav);border-radius:12px;padding:10px 14px;font-size:20px;color:var(--ink)}
.winbox .btn{background:var(--gold);color:var(--ink)}
.winners{display:none}.winners.show{display:block}
.party{position:fixed;inset:0;z-index:20;background:var(--night);display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:24px;overflow:hidden;cursor:pointer}
.party.open{display:flex}
.party canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.party .kind{position:relative;margin:0;font-size:clamp(80px,16vw,260px);font-weight:800;line-height:.9;color:var(--gold)}
.party .who{position:relative;margin:18px 0 0;font-size:clamp(34px,5vw,84px);font-weight:700;color:var(--white);overflow-wrap:anywhere}
.party .card{position:relative;margin:8px 0 0;font-size:clamp(20px,2.2vw,34px);color:var(--lav)}
.party .btn{position:relative;margin-top:34px;background:var(--purple)}
.party.open .kind{animation:boom .9s cubic-bezier(.2,1.5,.35,1)}
.party.open .who{animation:pop .6s .35s both cubic-bezier(.2,1.4,.4,1)}
@keyframes boom{0%{transform:scale(.3) rotate(-8deg);opacity:0}100%{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.party.open .kind,.party.open .who{animation:none}}

.status{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.pill{border-radius:14px;padding:8px 14px;font-size:clamp(15px,1.25vw,19px);background:var(--deep);color:var(--lav)}
.pill b{color:var(--white);font-weight:700}
.pill.on{background:var(--gold);color:var(--ink)}.pill.on b{color:var(--ink)}
.inplay{display:flex;align-items:center;gap:8px;color:var(--lav);font-size:clamp(15px,1.2vw,18px)}
.inplay input{width:72px;border:0;border-radius:10px;padding:6px 8px;font-size:18px;font-weight:700;text-align:center;background:var(--deep);color:var(--white)}
.alert{position:fixed;inset:0;z-index:15;background:rgba(20,16,52,.9);display:none;align-items:center;justify-content:center;padding:20px}
.alert.open{display:flex}
.abox{background:var(--gold);color:var(--ink);border-radius:28px;padding:clamp(24px,3.4vw,56px);width:min(900px,100%);text-align:center}
.abox h2{margin:0;font-size:clamp(40px,5.6vw,92px);line-height:1;font-weight:800}
.abox p{margin:14px 0 0;font-size:clamp(20px,2.2vw,34px);font-weight:600}
.abox .sm{font-size:clamp(15px,1.4vw,20px);font-weight:500;color:var(--goldDark)}
.abtns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:26px}
.abtns .btn{background:var(--night);color:var(--white)}
.abtns .btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.abox.ring{animation:ring .7s cubic-bezier(.2,1.5,.35,1)}
@keyframes ring{0%{transform:scale(.7);opacity:0}100%{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.abox.ring{animation:none}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <span class="note" aria-hidden="true">♫</span>
      <div>
        <h1>Bingo musical <svg width="0.8em" height="0.8em" viewBox="0 0 24 24" aria-hidden="true"><path fill="#F2A93B" d="M12 1.8l3.1 6.6 7.2.9-5.3 5 1.4 7.1L12 17.9l-6.4 3.5L7 14.3l-5.3-5 7.2-.9z"/></svg></h1>
        <p>Cumple de Lulú</p>
      </div>
    </div>
    <div class="progress" aria-live="polite"><div class="bar"><i id="barFill"></i></div><span><b id="count">0</b> de 64 temas</span></div>
  </header>

  <main>
    <section class="stage">
      <div class="now empty" id="now" aria-live="polite">
        <span class="num" id="nowNum"></span>
        <p class="k" id="nowK">Todo listo</p>
        <h2 id="nowTitle">Que empiece la música</h2>
        <p class="artist" id="nowArtist">Tocá el tema que suena en el tablero</p>
        <svg class="bigstar" viewBox="0 0 24 24" aria-hidden="true"><path fill="#F2A93B" d="M12 1.8l3.1 6.6 7.2.9-5.3 5 1.4 7.1L12 17.9l-6.4 3.5L7 14.3l-5.3-5 7.2-.9z"/></svg>
      </div>
      <div class="status" aria-live="polite">
        <span class="pill" id="pLine">Primera línea: <b>todavía no</b></span>
        <span class="pill" id="pBingo">Bingo: <b>todavía no</b></span>
        <label class="inplay" for="inPlay">Cartones repartidos: del 1 al <input id="inPlay" type="number" min="1" max="30" value="30" inputmode="numeric"></label>
      </div>
      <div class="prev">
        <h3>Antes sonaron</h3>
        <div class="chips" id="chips"><span class="none">Todavía nada</span></div>
      </div>
      <div class="prev winners" id="winners">
        <h3>Ganadores</h3>
        <div class="chips" id="winChips"></div>
      </div>
      <div class="actions">
        <button class="btn gold" id="btnCheck">Controlar cartón</button>
        <button class="btn" id="btnRandom">Elegir tema al azar</button>
        <button class="btn ghost" id="btnUndo">Deshacer último</button>
        <button class="btn ghost" id="btnReset">Nuevo juego</button>
      </div>
    </section>

    <section class="board" aria-label="Tablero de canciones">
      <div class="search">
        <label class="sr" for="q">Buscar tema</label>
        <input id="q" type="search" placeholder="Buscar tema o artista (Enter marca el primero)" autocomplete="off">
      </div>
      <p class="hint" id="hint"></p>
      <div class="grid" id="grid"></div>
    </section>
  </main>
</div>

<div class="overlay" id="ov" role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div class="modal">
    <div class="mhead">
      <h2 id="mTitle">Controlar cartón</h2>
      <div class="pick">
        <label class="sr" for="cardNo">Número de cartón</label>
        <input id="cardNo" type="number" min="1" max="30" inputmode="numeric" placeholder="N°">
        <button class="btn" id="btnShow">Ver cartón</button>
      </div>
    </div>
    <p class="err" id="err"></p>
    <div class="cgrid-wrap"><div class="cgrid" id="cgrid"></div></div>
    <p class="verdict" id="verdict"></p>
    <div class="winbox" id="winbox">
      <label class="sr" for="winName">Nombre del ganador</label>
      <input id="winName" type="text" maxlength="30" placeholder="Nombre del ganador (opcional)" autocomplete="off">
      <button class="btn" id="btnParty">Festejar en pantalla</button>
    </div>
    <div class="mfoot"><button class="btn" id="btnClose">Volver al juego</button></div>
  </div>
</div>

<div class="alert" id="alert" role="alertdialog" aria-modal="true" aria-labelledby="aTitle">
  <div class="abox" id="abox">
    <h2 id="aTitle"></h2>
    <p id="aCards"></p>
    <p class="sm" id="aSub"></p>
    <div class="abtns" id="aBtns"></div>
  </div>
</div>
<div class="party" id="party" role="dialog" aria-modal="true" aria-labelledby="pKind">
  <canvas id="confetti" aria-hidden="true"></canvas>
  <p class="kind" id="pKind">¡Bingo!</p>
  <p class="who" id="pWho"></p>
  <p class="card" id="pCard"></p>
  <button class="btn" id="btnParty2">Seguir jugando</button>
</div>
<script>

const KEY="bingoLulu_v1";
let played=[];
try{const s=JSON.parse(localStorage.getItem(KEY)||"[]");if(Array.isArray(s))played=s.filter(n=>Number.isInteger(n)&&n>=0&&n<64);}catch(e){}
let winners=[];
try{const w=JSON.parse(localStorage.getItem(KEY+"_w")||"[]");if(Array.isArray(w))winners=w.filter(x=>x&&typeof x.k==="string");}catch(e){}
const $=id=>document.getElementById(id);
const norm=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();

const grid=$("grid");
SONGS.forEach((s,i)=>{
  const b=document.createElement("button");
  b.className="tile";b.dataset.i=i;
  b.setAttribute("aria-label",`${i+1}. ${s[0]}, ${s[1]}`);
  b.innerHTML=`<span class="n">${i+1}</span><span class="t"></span>`;
  b.querySelector(".t").textContent=s[0];
  b.addEventListener("click",()=>mark(i));
  grid.appendChild(b);
});

function save(){try{localStorage.setItem(KEY,JSON.stringify(played));localStorage.setItem(KEY+"_w",JSON.stringify(winners));}catch(e){}}
function renderWinners(){
  const box=$("winners"),c=$("winChips");c.innerHTML="";
  box.classList.toggle("show",winners.length>0);
  winners.forEach(w=>{const s=document.createElement("span");s.className="chip";const b=document.createElement("b");b.textContent=w.k;s.append(b,(w.name?w.name+" · ":"")+"N° "+String(w.n).padStart(2,"0"));c.appendChild(s);});
}
let hintT;
function hint(t){$("hint").textContent=t;clearTimeout(hintT);hintT=setTimeout(()=>$("hint").textContent="",3500);}

function render(pop){
  const cur=played[played.length-1];
  document.querySelectorAll(".tile").forEach(t=>{
    const i=+t.dataset.i;
    t.classList.toggle("played",played.includes(i));
    t.classList.toggle("current",i===cur);
  });
  $("count").textContent=played.length;
  $("barFill").style.width=(played.length/64*100)+"%";
  const now=$("now");
  if(cur===undefined){
    now.classList.add("empty");$("nowK").textContent="Todo listo";$("nowNum").textContent="";
    $("nowTitle").textContent="Que empiece la música";$("nowArtist").textContent="Tocá el tema que suena en el tablero";
  }else{
    now.classList.remove("empty");$("nowK").textContent="Ahora suena";
    $("nowNum").textContent=`Tema ${played.length} de 64`;
    $("nowTitle").textContent=SONGS[cur][0];$("nowArtist").textContent=SONGS[cur][1];
    if(pop){now.classList.remove("pop");void now.offsetWidth;now.classList.add("pop");}
  }
  const chips=$("chips");chips.innerHTML="";
  const prev=played.slice(0,-1).slice(-6).reverse();
  if(!prev.length){chips.innerHTML='<span class="none">Todavía nada</span>';}
  prev.forEach(i=>{const c=document.createElement("span");c.className="chip";c.innerHTML=`<b>${i+1}</b>`;c.append(SONGS[i][0]);chips.appendChild(c);});
}

function mark(i){
  if(played.includes(i)){hint(`"${SONGS[i][0]}" ya sonó. Si fue un error, usá Deshacer último.`);return;}
  played.push(i);save();render(true);
  const st=updateStatus();
  if(st.B&&st.B.at===played.length)showAlert("bingo",st.B);
  else if(st.L&&st.L.at===played.length)showAlert("line",st.L);
  $("q").value="";filter("");
}
$("btnRandom").onclick=()=>{
  const left=[...Array(64).keys()].filter(i=>!played.includes(i));
  if(!left.length){hint("Ya sonaron los 64 temas.");return;}
  mark(left[Math.floor(Math.random()*left.length)]);
};
$("btnUndo").onclick=()=>{
  if(!played.length){hint("No hay nada para deshacer.");return;}
  const i=played.pop();save();render(false);updateStatus();hint(`Se desmarcó "${SONGS[i][0]}".`);
};
let resetArmed=false,resetT;
$("btnReset").onclick=()=>{
  const b=$("btnReset");
  if(!resetArmed){resetArmed=true;b.textContent="¿Seguro? Tocá de nuevo";b.classList.add("warn");
    resetT=setTimeout(()=>{resetArmed=false;b.textContent="Nuevo juego";b.classList.remove("warn");},4000);return;}
  clearTimeout(resetT);resetArmed=false;b.textContent="Nuevo juego";b.classList.remove("warn");
  played=[];winners=[];save();render(false);renderWinners();updateStatus();hint("Juego reiniciado.");
};

function filter(q){
  const n=norm(q.trim());
  document.querySelectorAll(".tile").forEach(t=>{
    const s=SONGS[+t.dataset.i];
    const ok=!n||norm(s[0]+" "+s[1]).includes(n)||String(+t.dataset.i+1)===n;
    t.classList.toggle("dim",!ok);
  });
}
$("q").addEventListener("input",e=>filter(e.target.value));
$("q").addEventListener("keydown",e=>{
  if(e.key==="Enter"){
    const n=norm(e.target.value.trim());if(!n)return;
    const hits=[...SONGS.keys()].filter(i=>!played.includes(i)&&(norm(SONGS[i][0]+" "+SONGS[i][1]).includes(n)||String(i+1)===n));
    if(hits.length===1)mark(hits[0]);
    else if(!hits.length)hint("No hay temas sin sonar que coincidan.");
    else hint(`Hay ${hits.length} coincidencias. Tocá el que suena.`);
  }
});
document.addEventListener("keydown",e=>{
  if(e.key==="/"&&document.activeElement!==$("q")&&!$("ov").classList.contains("open")){e.preventDefault();$("q").focus();}
  if(e.key==="Escape"&&$("ov").classList.contains("open"))closeOv();
});

const ov=$("ov");
function openOv(){ov.classList.add("open");$("mTitle").textContent="Controlar cartón";$("cardNo").value="";$("err").textContent="";$("winbox").classList.remove("show");$("winName").value="";$("cgrid").innerHTML="";$("verdict").textContent="";$("cardNo").focus();}
function closeOv(){ov.classList.remove("open");$("btnCheck").focus();}
$("btnCheck").onclick=openOv;$("btnClose").onclick=closeOv;
ov.addEventListener("click",e=>{if(e.target===ov)closeOv();});
$("cardNo").addEventListener("input",()=>$("err").textContent="");
$("cardNo").addEventListener("keydown",e=>{if(e.key==="Enter")showCard();});
$("btnShow").onclick=showCard;

let inPlay=30;
try{const v=parseInt(localStorage.getItem(KEY+"_n"),10);if(v>=1&&v<=30)inPlay=v;}catch(e){}
$("inPlay").value=inPlay;
$("inPlay").addEventListener("change",e=>{
  let v=parseInt(e.target.value,10);if(!(v>=1&&v<=30)){v=inPlay;}
  inPlay=v;e.target.value=v;try{localStorage.setItem(KEY+"_n",String(v));}catch(err){}
  updateStatus();hint(`Se controlan los cartones del 1 al ${v}.`);
});
function cardState(g,set){
  const lines=[0,1,2].filter(r=>g.slice(r*9,r*9+9).filter(x=>x>=0).every(x=>set.has(x))).length;
  const full=g.every(x=>x<0||set.has(x));return {lines,full};
}
function firstEvent(kind){
  const set=new Set();
  for(let k=0;k<played.length;k++){
    set.add(played[k]);const hits=[];
    for(let n=1;n<=inPlay;n++){const s=cardState(CARDS[n-1],set);if(kind==="line"?s.lines>=1:s.full)hits.push(n);}
    if(hits.length)return {at:k+1,cards:hits,song:played[k]};
  }
  return null;
}
const fmt=n=>"N° "+String(n).padStart(2,"0");
const listCards=a=>a.length===1?"Cartón "+fmt(a[0]):"Cartones "+a.map(fmt).join(", ").replace(/, ([^,]*)$/," y $1");
function updateStatus(){
  const L=firstEvent("line"),B=firstEvent("bingo");
  const pl=$("pLine"),pb=$("pBingo");
  pl.classList.toggle("on",!!L);pb.classList.toggle("on",!!B);
  pl.innerHTML="Primera línea: <b></b>";pl.querySelector("b").textContent=L?`${L.cards.map(fmt).join(", ")} (tema ${L.at})`:"todavía no";
  pb.innerHTML="Bingo: <b></b>";pb.querySelector("b").textContent=B?`${B.cards.map(fmt).join(", ")} (tema ${B.at})`:"todavía no";
  return {L,B};
}
function chime(big){
  try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;const a=new A();
    const notes=big?[523,659,784,1047]:[659,880];
    notes.forEach((f,i)=>{const o=a.createOscillator(),g=a.createGain();o.type="triangle";o.frequency.value=f;
      const t0=a.currentTime+i*.14;g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(.25,t0+.02);g.gain.exponentialRampToValueAtTime(.001,t0+.5);
      o.connect(g).connect(a.destination);o.start(t0);o.stop(t0+.55);});
  }catch(e){}
}
function showAlert(kind,ev){
  const box=$("abox");box.classList.remove("ring");void box.offsetWidth;box.classList.add("ring");
  $("aTitle").textContent=kind==="bingo"?"¡Hay bingo!":"¡Salió la primera línea!";
  $("aCards").textContent=listCards(ev.cards);
  $("aSub").textContent=`Con "${SONGS[ev.song][0]}", el tema ${ev.at} de la partida.`;
  const bt=$("aBtns");bt.innerHTML="";
  ev.cards.slice(0,4).forEach(n=>{const b=document.createElement("button");b.className="btn";b.textContent="Ver cartón "+fmt(n);
    b.onclick=()=>{closeAlert();openOv();$("cardNo").value=n;showCard();};bt.appendChild(b);});
  const c=document.createElement("button");c.className="btn ghost";c.textContent="Seguir jugando";c.onclick=closeAlert;bt.appendChild(c);
  $("alert").classList.add("open");chime(kind==="bingo");bt.firstChild.focus();
}
function closeAlert(){$("alert").classList.remove("open");}
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("alert").classList.contains("open"))closeAlert();});
let curWin=null,curCard=null;
function showCard(){
  const v=$("cardNo").value.trim();const n=parseInt(v,10);
  if(!v||!Number.isInteger(n)||n<1||n>30||String(n)!==String(+v)){$("err").textContent="Escribí un número de cartón del 1 al 30.";$("cgrid").innerHTML="";$("verdict").textContent="";return;}
  const g=CARDS[n-1];const set=new Set(played);
  $("mTitle").textContent=`Cartón N° ${String(n).padStart(2,"0")}`;
  const rowsDone=[0,1,2].map(r=>g.slice(r*9,r*9+9).filter(x=>x>=0).every(x=>set.has(x)));
  const cg=$("cgrid");cg.innerHTML="";
  g.forEach((x,idx)=>{
    const d=document.createElement("div");
    if(x<0){d.className="cc e";d.textContent="♪";}
    else{d.className="cc"+(set.has(x)?" hit":"")+(rowsDone[Math.floor(idx/9)]?" rowwin":"");
      const b=document.createElement("b");b.textContent=SONGS[x][0];const s=document.createElement("small");s.textContent=SONGS[x][1];d.append(b,s);}
    cg.appendChild(d);
  });
  const hits=g.filter(x=>x>=0&&set.has(x)).length;const lines=rowsDone.filter(Boolean).length;
  const vd=$("verdict");vd.className="verdict";
  curWin=hits===15?"¡Bingo!":lines===2?"¡Doble línea!":lines===1?"¡Línea!":null;curCard=n;
  $("winbox").classList.toggle("show",!!curWin);
  if(hits===15){vd.classList.add("win");vd.innerHTML='<svg width="1em" height="1em" viewBox="0 0 24 24" aria-hidden="true"><path fill="#F2A93B" d="M12 1.8l3.1 6.6 7.2.9-5.3 5 1.4 7.1L12 17.9l-6.4 3.5L7 14.3l-5.3-5 7.2-.9z"/></svg> ¡Bingo! Cartón completo';}
  else if(lines===2){vd.classList.add("win");vd.innerHTML=`¡Doble línea! <small>Tiene ${hits} de 15. Le faltan ${15-hits} para el bingo.</small>`;}
  else if(lines===1){vd.classList.add("win");const r=rowsDone.indexOf(true)+1;vd.innerHTML=`¡Línea en la fila ${r}! <small>Tiene ${hits} de 15. Le faltan ${15-hits} para el bingo.</small>`;}
  else{vd.innerHTML=`Todavía no hay línea <small>Tiene ${hits} de 15 temas tachados.</small>`;}
}
render(false);renderWinners();updateStatus();

const party=$("party"),cv=$("confetti"),cx=cv.getContext("2d");
let parts=[],raf=null;
const COLORS=["#F2A93B","#FFFFFF","#AFA9EC","#534AB7","#F7BC5E"];
function starPath(x,y,r){cx.beginPath();for(let k=0;k<10;k++){const a=-Math.PI/2+k*Math.PI/5,rr=k%2?r*.45:r;cx.lineTo(x+rr*Math.cos(a),y+rr*Math.sin(a));}cx.closePath();}
function burst(){
  const w=cv.width=innerWidth*devicePixelRatio,h=cv.height=innerHeight*devicePixelRatio;
  parts=[];for(let i=0;i<180;i++){parts.push({x:Math.random()*w,y:-Math.random()*h*.8,vy:(2+Math.random()*4)*devicePixelRatio,vx:(Math.random()-.5)*2*devicePixelRatio,r:(5+Math.random()*12)*devicePixelRatio,rot:Math.random()*6,vr:(Math.random()-.5)*.15,c:COLORS[i%COLORS.length],star:Math.random()<.45});}
  const start=performance.now();
  (function tick(now){
    cx.clearRect(0,0,w,h);
    const fade=Math.max(0,1-(now-start-6000)/2000);
    parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;if(p.y>h+20&&now-start<5000){p.y=-20;p.x=Math.random()*w;}
      cx.save();cx.globalAlpha=fade;cx.fillStyle=p.c;cx.translate(p.x,p.y);cx.rotate(p.rot);
      if(p.star){starPath(0,0,p.r);cx.fill();}else{cx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);}cx.restore();});
    if(fade>0&&party.classList.contains("open"))raf=requestAnimationFrame(tick);
  })(start);
}
function openParty(){
  if(!curWin)return;
  const name=$("winName").value.trim();
  winners.push({k:curWin.replace(/[¡!]/g,""),name,n:curCard});save();renderWinners();
  $("pKind").textContent=curWin;
  $("pWho").textContent=name?`¡Felicitaciones, ${name}!`:"¡Felicitaciones!";
  $("pCard").textContent=`Cartón N° ${String(curCard).padStart(2,"0")}`;
  ov.classList.remove("open");party.classList.add("open");$("btnParty2").focus();
  cancelAnimationFrame(raf);
  if(!matchMedia("(prefers-reduced-motion: reduce)").matches)burst();
}
function closeParty(){party.classList.remove("open");cancelAnimationFrame(raf);cx.clearRect(0,0,cv.width,cv.height);$("btnCheck").focus();}
$("btnParty").onclick=openParty;
$("winName").addEventListener("keydown",e=>{if(e.key==="Enter")openParty();});
party.addEventListener("click",closeParty);
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&party.classList.contains("open"))closeParty();});
</script>
